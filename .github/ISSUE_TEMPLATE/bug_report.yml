name: Bug report
description: Report a problem with the launcher.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce the problem.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV or emulator and Android version
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Logs or screenshots
      description: Remove personal data before sharing.
